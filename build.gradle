        eventtrailArsDependencyDirectory         : [['curios-neoforge-9.5.1+1.21.1.jar', 'Curios'],
                                                    ['geckolib-neoforge-1.21.1-4.9.2.jar', 'GeckoLib']],
        eventtrailMovingStorageJarDirectory      : [['create-1.21.1-6.0.10.jar', 'Create'],
                                                    ['sophisticatedstoragecreateintegration-1.21.1-0.1.21.209.jar',
                                                     'SophisticatedStorageCreateIntegration'],
                                                    ['sophisticatedstorageinmotion-1.21.1-0.10.34.358.jar',
                                                     'SophisticatedStorageInMotion'],
                                                    ['sophisticatedcore-1.21.1-1.4.90.2299.jar', 'SophisticatedCore'],
                                                    ['sophisticatedstorage-1.21.1-1.5.91.2127.jar', 'SophisticatedStorage']],
        eventtrailEnderPocketJarDirectory        : [['EnderStorage-1.21.1-2.13.0.191.jar', 'EnderStorage'],
                                                    ['pocketstorage-1.2.5+1.21.1-b3.jar', 'PocketStorage'],
                                                    ['CodeChickenLib-1.21.1-4.6.1.529.jar', 'CodeChickenLib']],
        eventtrailVirtualStorageAeroJarDirectory : [['commoncapabilities-1.21.1-neoforge-2.11.5-363.jar', 'CommonCapabilities'],
                                                    ['cyclopscore-1.21.1-neoforge-1.29.3-1092.jar', 'CyclopsCore'],
                                                    ['integrateddynamics-1.21.1-neoforge-1.35.0-2002.jar', 'IntegratedDynamics'],
                                                    ['integratedterminals-1.21.1-neoforge-1.8.0-841.jar', 'IntegratedTerminals'],
                                                    ['integratedtunnels-1.21.1-neoforge-1.10.0-737.jar', 'IntegratedTunnels'],
                                                    ['mcjtylib-1.21-9.0.21.jar', 'McJtyLib'],
                                                    ['rftoolsbase-1.21-6.0.11.jar', 'RftoolsBase'],
                                                    ['rftoolsstorage-1.21-6.0.5.jar', 'RftoolsStorage']],
        eventtrailVirtualStorageStoneJarDirectory: [['curios-neoforge-9.5.1+1.21.1.jar', 'Curios'],
                                                    ['geckolib-neoforge-1.21.1-4.9.2.jar', 'GeckoLib'],
                                                    ['modonomicon-1.21.1-neoforge-1.120.4.jar', 'Modonomicon'],
                                                    ['occultism-1.21.1-neoforge-1.224.3.jar', 'Occultism'],
                                                    ['SmartBrainLib-neoforge-1.21.1-1.16.11.jar', 'SmartBrainLib']]
]
def eventtrailDroppedRetainedLengthRequired = ['eventtrailVirtualStorageAeroJarDirectory',
                                               'eventtrailVirtualStorageStoneJarDirectory'] as Set
def eventtrailAppliedInitScripts = gradle.startParameter.initScripts.collect { it.name }.toSet()
eventtrailDroppedRetainedProperties.each { String name, List consumers ->
    if (providers.gradleProperty(name).isPresent() && !consumers.any { eventtrailAppliedInitScripts.contains(it) }) {
        throw new GradleException('Refused: ' + name + ' is no longer read by build.gradle (item 21i); it is accepted only '
                + 'with one of these init scripts applied: ' + (consumers.isEmpty() ? 'none' : consumers.join(', ')))
    }
    if (name == 'eventtrailSableApiJar' && providers.gradleProperty(name).isPresent()) {
        def refuseSable = { String why ->
            new GradleException('Refused: ' + name + ' ' + why + ' (item 21i fold 4); expected sha256 '
                    + eventtrailSableArchiveSha256)
        }
        File sable = null
        try {
            sable = file(providers.gradleProperty(name).get())
        } catch (Exception ignored) {
            sable = null
        }
        if (sable == null || !sable.isFile()) throw refuseSable('is missing or not a regular file')
        byte[] sableContent = null
        try {
            sableContent = sable.bytes
        } catch (Exception ignored) {
            sableContent = null
        }
        if (sableContent == null) throw refuseSable('could not be read')
        def sableHash = java.util.HexFormat.of().formatHex(
                java.security.MessageDigest.getInstance('SHA-256').digest(sableContent))
        if (sableHash != eventtrailSableArchiveSha256) throw refuseSable('has the wrong sha256')
    }
    def pinChecks = eventtrailDroppedRetainedPinChecks[name]
    if (pinChecks == null || !providers.gradleProperty(name).isPresent()) return
    def value = providers.gradleProperty(name).get()
    pinChecks.each { List check ->
        String entryName = check[0]
        def pin = eventtrailApiPins[check[1]]
        String label = entryName == null ? name : name + ' entry ' + entryName
        def refuse = { String why ->
            new GradleException('Refused: ' + label + ' ' + why + ' (item 21i fold 3); expected sha256 '
                    + (pin == null ? 'none' : pin.expectedHash))
        }
        if (pin == null || (pin.expectedBytes == null && eventtrailDroppedRetainedLengthRequired.contains(name)))
            throw refuse('has no pin to check it against')
        File api = null
        try {
            api = entryName == null ? file(value) : new File(value, entryName)
        } catch (Exception ignored) {
            api = null
        }
        if (api == null || !api.isFile()) throw refuse('is missing or not a regular file')
        if (pin.expectedBytes != null && api.length() != pin.expectedBytes) throw refuse('has the wrong length')
        byte[] content = null
        try {
            content = api.bytes
        } catch (Exception ignored) {
            content = null
        }
        if (content == null) throw refuse('could not be read')
        def hash = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(content))
        if (hash != pin.expectedHash) throw refuse('has the wrong sha256')
    }
}

base {
    archivesName = 'EventTrail-1.21.1-NeoForge'
}

apply from: rootProject.file('gradle/eventtrail-java-conventions.gradle')

if (providers.gradleProperty('eventtrailBoundaryBuildDir').isPresent()) {
    layout.buildDirectory = layout.projectDirectory.dir(
            providers.gradleProperty('eventtrailBoundaryBuildDir').get())
}

// Item 21i: each exclusiveContent block below is the only repository asked for what its filter names, and that
// repository is asked for nothing else. Most filters name a group. Two name modules: org.junit:junit-bom alone, and
// io.codechicken's CodeChickenLib, EnderStorage and DiffPatch. Other org.junit and io.codechicken modules are not
// exclusive, so Gradle may ask any non-exclusive repository (mavenCentral() included) for them. Whatever repository
// serves an artifact, it still fails closed through gradle/verification-metadata.xml (verify-metadata true). All are
// public, anonymous HTTPS Maven repositories: no credentials, no token and no repository that needs a login (GitHub
// Packages is not used).
repositories {
    mavenCentral()
    // Item 21i fold 4: org.junit:junit-bom is never a dependency here. It is only a BOM that third-party POMs import
    // (sqlite-jdbc, commons-io, commons-parent, log4j). Its POMs carry Gradle's "published-with-gradle-metadata"
    // marker, so a fresh Gradle home also fetched its .module files. This takes junit-bom from the same host as
    // before (maven.neoforged.net/releases), reading the POM only, and every other repository is skipped for it.
    exclusiveContent {
        forRepository {
            maven {
                name = 'NeoForgedJunitBomPomOnly'
                url = 'https://maven.neoforged.net/releases'
                metadataSources {
                    mavenPom()
                    ignoreGradleMetadataRedirection()
                }
            }
        }
        filter { includeModule 'org.junit', 'junit-bom' }
    }
    // Modrinth's Maven: maven.modrinth:<project slug>:<version number>.
    exclusiveContent {
        forRepository {
            maven {
                name = 'ModrinthMaven'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    // The mods' own Mavens, used where the exact version is there (Create and the Sophisticated mods are on
    // Modrinth or CurseMaven instead).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Covers1624Maven'
                url = 'https://maven.covers1624.net'
            }
        }
        // Item 21i folds 1-2 (review m2): exactly the three io.codechicken modules this build resolves. DiffPatch (a
        // NeoForge build-tool library) stays on the host T3 took it from, because T3 served all of io.codechicken here.
        filter {
            includeModule 'io.codechicken', 'CodeChickenLib'
            includeModule 'io.codechicken', 'EnderStorage'
            includeModule 'io.codechicken', 'DiffPatch'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'SapsDevMaven'
                url = 'https://maven.saps.dev/releases'
            }
        }
        filter { includeGroup 'com.flanks255' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'IllusiveC4Maven'
                url = 'https://maven.theillusivec4.top'
            }
        }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLibCloudsmithMaven'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven'
            }
        }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'SmartBrainLibCloudsmithMaven'
                url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven'
            }
        }
        filter { includeGroup 'net.tslat.smartbrainlib' }
    }
    // Sable's own Maven: group dev.ryanhcode.sable only (the jar is used non-transitively).
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanhcodeMaven'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter { includeGroup 'dev.ryanhcode.sable' }
    }
    // Mekanism's own Maven (modmaven.dev): group mekanism only.
    exclusiveContent {
        forRepository {
            maven {
                name = 'ModMaven'
                url = 'https://modmaven.dev'
            }
        }
        filter { includeGroup 'mekanism' }
    }
    // CurseMaven, for the jars (and optional-API fallbacks) that have no Modrinth or own-Maven source.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }

    runs {
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            loadedMods = [mods."${mod_id}"]
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    /*
     * DEVELOPMENT DEPENDENCY LAYOUT
     *
     * Database libraries are compileOnly + additionalRuntimeClasspath during active
     * development. This keeps exactly one runtime copy visible to NeoForge/FML and
     * avoids JPMS duplicate-module failures on Minecraft 1.21.1.
     *
     * The separate, non-transitive jarJar declarations package the same tested
     * versions for production without adding another copy to development runs.
     */
    compileOnly("org.xerial:sqlite-jdbc:${eventtrailSqliteJdbcPreferredVersion}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    additionalRuntimeClasspath("org.xerial:sqlite-jdbc:${eventtrailSqliteJdbcPreferredVersion}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    compileOnly('com.zaxxer:HikariCP:7.0.2') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    additionalRuntimeClasspath('com.zaxxer:HikariCP:7.0.2') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    compileOnly('com.mysql:mysql-connector-j:26.7.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
    additionalRuntimeClasspath('com.mysql:mysql-connector-j:26.7.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
    compileOnly 'org.postgresql:postgresql:42.7.13'
    additionalRuntimeClasspath 'org.postgresql:postgresql:42.7.13'

    jarJar('org.xerial:sqlite-jdbc') {
        version {
            strictly(eventtrailSqliteJdbcSupportedRange)
            prefer(eventtrailSqliteJdbcPreferredVersion)
        }
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    jarJar('com.zaxxer:HikariCP:[7.0.2]') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    jarJar('com.mysql:mysql-connector-j:[26.7.0]') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
    jarJar 'org.postgresql:postgresql:[42.7.13]'

    // Optional menu adapters compile against the exact 1.21.1 generations
    // validated by this branch. They are never bundled or required at runtime.
    compileOnly(eventtrailMovingCoreApi)
    compileOnly(eventtrailMovingStorageApi)
    eventtrailMovingStorageApis.each { compileOnly(it) }
    eventtrailEnderPocketApis.each { compileOnly(it) }
    eventtrailVirtualStorageApis.each { compileOnly(it) }
    eventtrailCreateNestedApis.each { compileOnly(it) }
    compileOnly(eventtrailBackpacksApi)
    compileOnly(eventtrailLootrApi)
    compileOnly(eventtrailIronsApi)
    compileOnly(eventtrailArsApi)
    compileOnly(eventtrailSableApi) {
        transitive = false
    }
    compileOnly(eventtrailSableCompanionApi)
    eventtrailArsDependencies.each { compileOnly(it) }
    eventtrailGadgetApis.each { compileOnly(it) }
    eventtrailFunctionalStorageApis.each { compileOnly(it) }
    compileOnly(eventtrailMekanismApi)
    compileOnly(eventtrailAe2Api)
    compileOnly(eventtrailEnderIoApi)
    compileOnly(eventtrailRefinedStorageApi)
    compileOnly(eventtrailMetalBarrelsApi)
}

// Item 21i fold 1 (review M1): the jarJar sqlite-jdbc range above stays declared, because it is written into the
// jarjar metadata, but only the preferred version may be selected for it. The rule reads the candidate id alone, so
// Gradle fetches no pom of any other release in the range.
configurations.named('jarJar') {
    resolutionStrategy.componentSelection {
        withModule('org.xerial:sqlite-jdbc') { ComponentSelection selection ->
            if (selection.candidate.version != '3.53.2.1') {
                selection.reject('EventTrail bundles org.xerial:sqlite-jdbc 3.53.2.1 only')
            }
        }
    }
}

// Restructure M1 (Owner decision D2): :common compiles common/src/main/java alone first, as the boundary check; the
// root then compiles those sources in its one javac run, so the shipped jar holds the same classes as before.
tasks.named('compileJava') {
    dependsOn ':common:compileJava'
    source(project(':common').sourceSets.main.java)
}

// Restructure M2 (item 21h): every compat/<folder>/src/main/java joins the root's main source set, in one sorted glob
// (a '+' in a folder name is kept verbatim), so the root still compiles every source in its one javac run.
def eventtrailCompatRoots = (file('compat').listFiles() ?: new File[0])
        .findAll { new File(it, 'src/main/java').directory }
        .sort { it.name }
        .collect { new File(it, 'src/main/java') }
eventtrailCompatRoots.each { sourceSets.main.java.srcDir(it) }

// :common compiles against exactly these of the root's own resolved compile libraries (byte-identity condition C3).
def eventtrailCommonLibraries = ['org.ow2.asm:asm', 'org.ow2.asm:asm-tree', 'org.apache.logging.log4j:log4j-api',
        'net.java.dev.jna:jna']
def eventtrailCommonLibraryView = configurations.compileClasspath.incoming.artifactView {
    componentFilter { id ->
        id instanceof ModuleComponentIdentifier
                && eventtrailCommonLibraries.contains("${id.group}:${id.module}".toString())
    }
}
tasks.register('syncEventTrailCommonLibraries', Sync) {
    description = "Copies the root's own resolved libraries that :common compiles against (restructure M1)."
    from eventtrailCommonLibraryView.files
    into layout.buildDirectory.dir('eventtrail-common-libraries')
    doLast {
        def found = eventtrailCommonLibraryView.artifacts.artifacts.collect { artifact ->
            def id = artifact.id.componentIdentifier
            "${id.group}:${id.module}".toString()
        }.sort()
        if (found != eventtrailCommonLibraries.sort(false)) {
            throw new GradleException(':common needs exactly ' + eventtrailCommonLibraries
                    + ' from the root compile classpath, found ' + found)
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

def internalTestingScript = layout.projectDirectory.file(
        'internal-testing/scripts/gradle/eventtrail-internal-testing.gradle').asFile
def publicBoundaryOnly = providers.gradleProperty('eventtrailPublicBoundary')
        .map { it.toBoolean() }.orElse(false).get()
if (!publicBoundaryOnly && internalTestingScript.isFile()) {
    apply from: internalTestingScript
    // Isolated exact-current Integrated runtime tests; production still compiles against
    // the retained1.8.0 API and no optional content enters the release artifact.
    tasks.register('testIntegratedAtm10', Test) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        def expected = [
                'integratedterminals-1.21.1-neoforge-1.10.0.jar': [821796L, '302226a8e7c10ada5636c76ab38852dda66da2417e03d541e7a83ead94ff2c2a'],
                'integrateddynamics-1.21.1-neoforge-1.37.1-2160.jar': [4468582L, '24ae1a90504c622c28a197a590d8636836e6cf29d220603a4e130819036126fe'],
                'integratedtunnels-1.21.1-neoforge-1.12.0-792.jar': [744645L, '0dae12f0dd93226f42fb83a54bf2a3f20ca4c68955df7609f4be6403fd79b60a'],
                'commoncapabilities-1.21.1-neoforge-2.11.6.jar': [283980L, '05f8237f6ae7e5acf1a8c0756c714da1d6b3151fea4ad60941b57de788315abf'],
                'cyclopscore-1.21.1-neoforge-1.30.0.jar': [1163177L, '6328e41c0e26979a9c56ec42c02321b139914c4711424ab53727a109a312f6a1']]
        def currentJars = files(providers.provider {
            def directory = providers.gradleProperty('eventtrailIntegratedAtm10JarDirectory').get()
            expected.collect { name, identity ->
                def jar = new File(directory, name)
                if (!jar.isFile() || jar.length() != identity[0]) throw new GradleException('Exact ATM10 Integrated length mismatch: ' + name)
                def hash = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes))
                if (hash != identity[1]) throw new GradleException('Exact ATM10 Integrated identity mismatch: ' + name)
                jar
            }
        })
        // Item 21i: the compile-only Integrated jars are the public-source jars resolved above (file names such as
        // integrated-terminals-295910-8770243.jar); this task subtracts exactly those resolved files.
        def legacyJars = files(eventtrailIntegratedStorageApis)
        classpath = sourceSets.test.runtimeClasspath.minus(legacyJars).plus(currentJars)
        systemProperty 'eventtrail.test.integratedFamily', 'ATM10_1_10'
        filter {
            includeTestsMatching 'io.github.betapetey.eventtrail.inventory.adapters.integrated.*'
            includeTestsMatching 'io.github.betapetey.eventtrail.inventory.optional.OptionalMenuAdapterLoaderTest'
            includeTestsMatching 'io.github.betapetey.eventtrail.inventory.optional.OptionalIntegrationCompatibilityTest'
            includeTestsMatching 'io.github.betapetey.eventtrail.compat.hooks.HookRealJarPassTest'
        }
        workingDir = layout.buildDirectory.dir('test-integrated-atm10-work').get().asFile
        doFirst {
            workingDir.mkdirs()
            def selected = classpath.files.findAll { f -> expected.keySet().any { name ->
                f.name.startsWith(name.substring(0, name.indexOf('-1.21.1-'))) } }.toSet()
            if (selected != currentJars.files.toSet()) throw new GradleException('Mixed Integrated runtime')
            // The resolved compile-only jars carry their repository's file names, so the name test above does not
            // see them: refuse any of those exact files (or a second copy of them by name) on this class path.
            def resolvedLegacy = legacyJars.files
            def legacyNames = ['integrated-dynamics-', 'integrated-terminals-', 'integrated-tunnels-',
                               'common-capabilities-', 'cyclops-core-']
            if (classpath.files.any { f -> resolvedLegacy.contains(f)
                    || legacyNames.any { prefix -> f.name.startsWith(prefix) } })
                throw new GradleException('Mixed Integrated runtime: a public-source API jar is on the class path')
            println 'EVENTTRAIL_EXACT_INTEGRATED_RUNTIME=ATM10_1_10'
        }
    }
    // Parts readers link tests (design-03 0.8): each reader's start-time member check against the exact
    // pinned mod jar. Isolated from the unit-test runtime, where GuardedMenuAdapterLoaderTest defines
    // stand-in classes with AE2's own names; the default test task runs the same tests with the mods absent.
    // Resolved from Gradle's own cache, as compileOnly resolves the same coordinates (no other repository); the
    // runtime library variant is asked for by name, so AE2's published module metadata picks one jar. Ender IO is
    // the E1 coordinate (Modrinth Maven, pinned above).
    configurations.create('eventtrailPartsReaderLinkJars') {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        }
    }
    dependencies.add('eventtrailPartsReaderLinkJars', 'org.appliedenergistics:appliedenergistics2:19.2.17')
    dependencies.add('eventtrailPartsReaderLinkJars', eventtrailEnderIoApi)
    tasks.register('testPartsReaderLinks', Test) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        def expected = [
                'appliedenergistics2-19.2.17.jar': [8230896L, '460d779a0609b81409907d9956de8f6f70a1b0912257e3e5c3c7e75ac9630e95'],
                (eventtrailEnderIoApiJarName): [6598496L, '5fe098153dddc2e7ccd9d38b0341dbc61f3072150958c916e5ef63f395e4eab1']]
        // A runtime jar of a linked mod is one whose name starts with one of these (AE2, Ender IO by its pack name
        // and by its former CurseMaven name); the guard below refuses a second copy already on the test class path.
        def linkedRuntimePrefixes = ['appliedenergistics2', 'enderio-', 'ender-io-']
        def linkJars = files(providers.provider {
            def resolved = configurations.eventtrailPartsReaderLinkJars.files
            if (resolved*.name.toSet() != expected.keySet()) throw new GradleException('Parts reader link jar set mismatch: ' + resolved*.name)
            resolved.collect { jar ->
                def identity = expected[jar.name]
                if (!jar.isFile() || jar.length() != identity[0]) throw new GradleException('Parts reader link jar length mismatch: ' + jar.name)
                def hash = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes))
                if (hash != identity[1]) throw new GradleException('Parts reader link jar identity mismatch: ' + jar.name)
                jar
            }
        })
        classpath = sourceSets.test.runtimeClasspath.plus(linkJars)
        systemProperty 'eventtrail.test.partsReaderLinks', 'true'
        filter {
            includeTestsMatching 'io.github.betapetey.eventtrail.events.parts.*PartReaderLinkTest'
        }
        workingDir = layout.buildDirectory.dir('test-parts-reader-links-work').get().asFile
        doFirst {
            workingDir.mkdirs()
            def selected = classpath.files.findAll { f -> linkedRuntimePrefixes.any { prefix ->
                f.name.startsWith(prefix) } }.toSet()
            if (selected != linkJars.files.toSet()) throw new GradleException('Mixed parts reader link runtime: ' + selected*.name)
            println 'EVENTTRAIL_PARTS_READER_LINK_RUNTIME=AE2_19_2_17,ENDERIO_8_2_12_BETA'
        }
    }
}

// Production packaging remains a public build concern: resource expansion,
// reproducibility, third-party source verification, and JAR isolation must work
// even when the optional internal-testing tree is not present.
apply from: 'gradle/eventtrail-compliance.gradle'
