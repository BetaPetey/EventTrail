// The repository root (restructure M3): an aggregator with no plugins. The NeoForge mod builds in :neoforge
// (neoforge/build.gradle) and :common is the platform-neutral boundary compile (settings.gradle). This file stays
// as the root marker the tests' repository-root locators look for (M3 D3). It holds the wrapper settings because
// the wrapper task exists only on the root project.
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
