configurations.create('eventtrailSableArchive') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
dependencies.add('eventtrailSableArchive', eventtrailSableApi)
def sableNestedApi = { String entry, String expectedHash ->
    files(providers.provider {
        def archive = configurations.eventtrailSableArchive.singleFile
        def digest = { File value -> java.util.HexFormat.of().formatHex(
                java.security.MessageDigest.getInstance('SHA-256').digest(value.bytes)) }
        if (digest(archive) != eventtrailSableArchiveSha256)
            throw new GradleException('Exact Sable API identity mismatch')
        def nested = zipTree(archive).matching { include(entry) }.singleFile
        if (digest(nested) != expectedHash) throw new GradleException('Exact nested Sable API identity mismatch')
        nested
    })
}
