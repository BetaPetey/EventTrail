plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

// Restructure M1: :common is evaluated first, so the root can compile its sources (see compileJava below).
evaluationDependsOn(':common')

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Keep the exact development/preferred artifact separate from the range that
// EventTrail uses for NeoForge JarJar runtime negotiation. Broad-core support is
// conditional on its verified local-file ownership/mutation lifecycle profile;
// the interval is not a security clearance for every core or an external client.
ext.eventtrailSqliteJdbcPreferredVersion = '3.53.2.1'
ext.eventtrailSqliteJdbcSupportedRange = '[3.25.2,3.54)'

// The exact-mod focused/loaded fixture supplies its retained dependencies, never bundles them.
ext.eventtrailIronsTestDependencies = []
if (providers.gradleProperty('eventtrailIronsDependencyDirectory').isPresent()) {
    def directory = providers.gradleProperty('eventtrailIronsDependencyDirectory').get()
    [
        ['curios-neoforge-9.5.1+1.21.1.jar', 'a45df2125c26219974aba7507ffc9afe7b83acc941a386af3faacb1cc0056fde'],
        ['geckolib-neoforge-1.21.1-4.9.2.jar', '5e548466af9ab6aca7a91a7c7d4dc0dc8bc385e22958aed5da0e7bebd0fa3fba'],
        ['irons_lib-1.21.1-2.1.0.jar', '3d0ad1003d6edeaad2500b9922267b4192d2c603cdd846fda339b168f4deff72'],
        ['player-animation-lib-forge-2.0.4+1.21.1.jar', 'dbe5de45f5cd60c0e5e47af14e6d564534a98456e973cf670cb881f6938eee92']
    ].each { entry ->
        def dependency = new File(directory, entry[0])
        def hash = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(dependency.bytes))
        if (hash != entry[1]) throw new GradleException('Retained Iron\'s fixture dependency identity mismatch')
        ext.eventtrailIronsTestDependencies.add(files(dependency))
    }
}

// Item 21i: pinned public-source API jars. Each jar is its own resolvable, non-transitive configuration (like
// eventtrailSableArchive below); the resolved file must have the pinned sha256 (and length where one is pinned) or the
// build fails. Sources (Owner answer 25): the mod's own Maven where it serves the exact, equal bytes, else Modrinth's
// Maven where it does, else CurseMaven (the repositories block names each once). Nothing here is bundled into
// EventTrail's JAR, and no repository needs a login. The 21 exact jars of C3-A6, C3-A7 and C3-A8 are declared further
// down with these helpers.
def eventtrailSha256 = { File value ->
    java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(value.bytes))
}
def eventtrailApiPins = [:]
def eventtrailVerifiedApiFile = { String key ->
    def pin = eventtrailApiPins[key]
    def api = pin.configuration.singleFile
    if (pin.expectedBytes != null && (!api.isFile() || api.length() != pin.expectedBytes))
        throw new GradleException('Pinned public API length mismatch: ' + pin.jarName + ' (' + pin.coordinate + ')')
    if (eventtrailSha256(api) != pin.expectedHash)
        throw new GradleException('Pinned public API identity mismatch: ' + pin.jarName + ' (' + pin.coordinate + ')')
    api
}
def eventtrailPinnedApi = { String key, String coordinate, String jarName, Long expectedBytes, String expectedHash ->
    def archive = configurations.create("eventtrailApi${key}".toString()) {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dependencies.add(archive.name, coordinate)
    eventtrailApiPins[key] = [configuration: archive, coordinate: coordinate, jarName: jarName,
                              expectedBytes: expectedBytes, expectedHash: expectedHash]
    files(providers.provider { eventtrailVerifiedApiFile(key) })
}
// A jar nested in one of the full jars above: read from that jar's own configuration, pinned by sha256.
def eventtrailNestedApi = { String key, String nestedEntry, String expectedHash ->
    files(providers.provider {
        def nested = zipTree(eventtrailVerifiedApiFile(key)).matching { include(nestedEntry) }.singleFile
        if (eventtrailSha256(nested) != expectedHash)
            throw new GradleException('Exact nested API identity mismatch: ' + nestedEntry)
        nested
    })
}
