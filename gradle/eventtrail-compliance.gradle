def verifyReleasePackage = tasks.register('verifyEventTrailReleasePackage') {
    group = 'verification'
    description = 'Verifies the exact four-JAR EventTrail production package boundary.'
    dependsOn mainJarTask
    dependsOn verifyMysqlSourceArchive
    inputs.file(productionArchive)
    inputs.files(configurations.jarJar)
    inputs.files(expectedPackagedResources.values())
    inputs.file(layout.projectDirectory.file('gradle.properties'))
    doLast {
        File archive = productionArchive.get().asFile
        if (!Files.isRegularFile(archive.toPath(), LinkOption.NOFOLLOW_LINKS)) {
            throw new GradleException('EventTrail production JAR is missing')
        }

        Properties projectProperties = new Properties()
        layout.projectDirectory.file('gradle.properties').asFile.withInputStream {
            projectProperties.load(it)
        }
        if (projectProperties.getProperty('mod_license') != 'Apache-2.0'
                || projectProperties.getProperty('mod_authors') != 'BetaPetey') {
            throw new GradleException(
                    'EventTrail project metadata must identify Apache-2.0 and BetaPetey')
        }

        def resolvedArtifacts = configurations.jarJar.resolvedConfiguration.resolvedArtifacts
        Map<String, File> artifactsByCoordinate = resolvedArtifacts.collectEntries { artifact ->
            def id = artifact.moduleVersion.id
            [("${id.group}:${id.name}:${id.version}".toString()): artifact.file]
        }
        if (artifactsByCoordinate.keySet() != expectedNestedArtifacts.values() as Set) {
            throw new GradleException(
                    "JarJar resolved an unexpected runtime dependency set: "
                            + "${artifactsByCoordinate.keySet().sort()}")
        }

        new ZipFile(archive).withCloseable { zip ->
            List<String> paths = zip.entries().collect { it.name }
            Set<String> duplicatePaths = paths.groupBy { it }.findAll {
                ignored, occurrences -> occurrences.size() != 1
            }.keySet()
            if (!duplicatePaths.isEmpty()) {
                throw new GradleException(
                        "EventTrail production JAR contains duplicate entries: ${duplicatePaths.sort()}")
            }

            Set<String> nestedJars = paths.findAll { it.endsWith('.jar') } as Set
            if (nestedJars != expectedNestedArtifacts.keySet()) {
                throw new GradleException(
                        "EventTrail production JAR must contain exactly "
                                + "${expectedNestedArtifacts.keySet().sort()}; "
                                + "found ${nestedJars.sort()}")
            }

            Set<String> expectedLicenseEntries = expectedPackagedResources.keySet()
                    .findAll { it.startsWith('META-INF/eventtrail/licenses/') } as Set
            Set<String> actualLicenseEntries = paths.findAll {
                it.startsWith('META-INF/eventtrail/licenses/') && !it.endsWith('/')
            } as Set
            if (actualLicenseEntries != expectedLicenseEntries) {
                throw new GradleException(
                        "EventTrail production JAR must contain exactly the required license "
                                + "resources ${expectedLicenseEntries.sort()}; "
                                + "found ${actualLicenseEntries.sort()}")
            }

            Set<String> exactOuterResources = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/neoforge.mods.toml',
                    'META-INF/jarjar/metadata.json',
                    'LICENSE',
                    'THIRD-PARTY-NOTICES',
                    'eventtrail.mixins.json',
                    'eventtrail-compat.mixins.json'
            ] as Set
            exactOuterResources.addAll(expectedNestedArtifacts.keySet())
            exactOuterResources.addAll(expectedPackagedResources.keySet())
            List<String> unexpectedOuterEntries = paths.findAll { path ->
                if (path.endsWith('/')) return false
                if (path.startsWith('io/github/betapetey/eventtrail/')
                        && path.endsWith('.class')) return false
                return !exactOuterResources.contains(path)
            }
            if (!unexpectedOuterEntries.isEmpty()) {
                throw new GradleException(
                        'EventTrail production JAR contains an unreviewed outer entry; '
                                + 'qualification/cache/provider/runtime inputs are never package '
                                + "surfaces: ${unexpectedOuterEntries.sort()}")
            }

            def entryBytes = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) {
                    throw new GradleException("EventTrail production JAR is missing ${path}")
                }
                zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            }

            expectedNestedArtifacts.each { nestedPath, coordinate ->
                byte[] nestedBytes = entryBytes(nestedPath)
                if (!Arrays.equals(artifactsByCoordinate[coordinate].bytes, nestedBytes)) {
                    throw new GradleException(
                            "${nestedPath} differs from the exact Gradle-resolved ${coordinate}")
                }

                boolean found = false
                new ZipInputStream(new ByteArrayInputStream(nestedBytes)).withCloseable { nested ->
                    def entry
                    while (!found && (entry = nested.nextEntry) != null) {
                        found = entry.name == expectedNestedClasses[nestedPath]
                    }
                }
                if (!found) {
                    throw new GradleException(
                            "${nestedPath} does not contain ${expectedNestedClasses[nestedPath]}")
                }
            }

            byte[] metadataBytes = entryBytes('META-INF/jarjar/metadata.json')
            def metadata = new JsonSlurper().parse(metadataBytes)
            if (!(metadata instanceof Map) || !(metadata.jars instanceof List)
                    || metadata.jars.size() != expectedJarJarMetadata.size()) {
                throw new GradleException('JarJar metadata has an unexpected structure')
            }
            List<Map<String, Object>> actualMetadata = metadata.jars.collect { row ->
                [group: row.identifier?.group, artifact: row.identifier?.artifact,
                 version: row.version?.artifactVersion, range: row.version?.range,
                 path: row.path, isObfuscated: row.isObfuscated]
            }
            List<Map<String, Object>> expectedMetadata = expectedJarJarMetadata.collect { row ->
                row + [isObfuscated: false]
            }
            if ((actualMetadata as Set) != (expectedMetadata as Set)
                    || actualMetadata.size() != (actualMetadata as Set).size()) {
                throw new GradleException(
                        "JarJar metadata does not describe the exact four dependencies: "
                                + "${actualMetadata}")
            }

            expectedPackagedResources.each { packagedPath, repositoryFile ->
                if (!Arrays.equals(repositoryFile.asFile.bytes, entryBytes(packagedPath))) {
                    throw new GradleException(
                            "Packaged resource ${packagedPath} differs from its repository input")
                }
            }

            List<String> forbidden = paths.findAll { path ->
                path == 'NOTICE'
                        || path.startsWith('META-INF/eventtrail/sources/')
                        || path.startsWith('META-INF/sbom/')
                        || path == 'META-INF/eventtrail/licenses/manifest.json'
                        || path.startsWith('com/google/protobuf/')
                        || path.startsWith('com/mysql/cj/')
                        || path.startsWith('com/zaxxer/hikari/')
                        || path.startsWith('org/mariadb/')
                        || path.startsWith('org/postgresql/')
                        || path.startsWith('io/opentelemetry/')
                        || path.contains('opentelemetry-')
                         || path.startsWith('org/sqlite/')
                         || path.startsWith('io/github/betapetey/eventtrail/auditruntime/')
                         || path.startsWith('io/github/betapetey/eventtrail/clientaudit/')
                         || path.startsWith('io/github/betapetey/eventtrail/compliance/')
                         || path.startsWith('io/github/betapetey/eventtrail/relink/')
                         || path.startsWith('assets/eventtrail_audit_test/')
                         || path.startsWith('data/eventtrail_audit_test/')
                         || path.startsWith('internal-testing/')
                        || path.contains('protobuf-java')
                        || path.contains('mariadb-java-client')
                        || path.contains('eventtrail-jdbc-tls-plugin')
                        || (!expectedNestedArtifacts.containsKey(path)
                                && isForbiddenQualificationPath(path))
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException(
                        "EventTrail production JAR contains a forbidden flattened, helper, "
                                + "or obsolete package surface: ${forbidden.sort()}")
            }

            String modsToml = new String(
                    entryBytes('META-INF/neoforge.mods.toml'), StandardCharsets.UTF_8)
            if (!modsToml.contains('license="Apache-2.0"')
                    || !modsToml.contains('authors="BetaPetey"')
                    || modsToml.contains('${')) {
                throw new GradleException(
                        'Packaged NeoForge metadata has incorrect or unexpanded rights metadata')
            }

            String archiveSha
            archive.withInputStream { input -> archiveSha = sha256Stream(input) }
            List<String> selfHashSurfaces = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/neoforge.mods.toml'
            ] + expectedPackagedResources.keySet()
            if (selfHashSurfaces.any { path ->
                new String(entryBytes(path), StandardCharsets.UTF_8)
                        .toUpperCase(Locale.ROOT).contains(archiveSha)
            }) {
                throw new GradleException(
                        'EventTrail production JAR must not embed its own archive hash')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyReleasePackage
    dependsOn verifyQualificationRepositoryBoundary
