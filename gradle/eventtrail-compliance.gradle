def sha256Stream = { InputStream input ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    byte[] buffer = new byte[8192]
    int count
    while ((count = input.read(buffer)) >= 0) {
        if (count > 0) digest.update(buffer, 0, count)
    }
    digest.digest().collect { String.format('%02X', it) }.join()
}

def verifyMysqlSourceArchive = tasks.register('verifyMySqlConnectorSourceArchive') {
    group = 'verification'
    description = 'Verifies the exact tracked MySQL Connector/J source archive and license.'
    inputs.file(mysqlSourceArchive)
    inputs.file(mysqlLicenseResource)
    doLast {
        File source = mysqlSourceArchive.asFile
        if (!Files.isRegularFile(source.toPath(), LinkOption.NOFOLLOW_LINKS)
                || source.length() != mysqlSourceArchiveSize) {
            throw new GradleException(
                    'MySQL Connector/J source archive is missing or has an unexpected size')
        }
        String actualSha
        source.withInputStream { input -> actualSha = sha256Stream(input) }
        if (!mysqlSourceArchiveSha256.equalsIgnoreCase(actualSha)) {
            throw new GradleException('MySQL Connector/J source archive SHA-256 mismatch')
        }

        Set<String> requiredEntries = [
                mysqlSourceRoot + '/LICENSE',
                mysqlSourceRoot + '/build.xml',
                mysqlSourceRoot + '/src/main/core-api/java/com/mysql/cj/CharsetMapping.java'
        ] as Set
        Set<String> observed = [] as Set
        tarTree(resources.gzip(source)).visit { details ->
            String path = details.relativePath.pathString
            if (requiredEntries.contains(path)) observed.add(path)
        }
        if (observed != requiredEntries) {
            throw new GradleException(
                    "MySQL Connector/J source archive is missing required source/build material; "
                            + "found ${observed.sort()}")
        }

        File archiveLicense = tarTree(resources.gzip(source))
                .matching { include mysqlSourceRoot + '/LICENSE' }
                .singleFile
        if (!Arrays.equals(archiveLicense.bytes, mysqlLicenseResource.asFile.bytes)) {
            throw new GradleException(
                    'Repository MySQL Connector/J license does not match the source archive')
        }
    }
}

