/*
 * Qualification pack installations and provider observations belong in the
 * marked external cache, never in Git or the production mod. Keep this guard
 * deliberately path/content based: reviewed schemas and small synthetic JSON
 * fixtures remain valid repository inputs, while executable/runtime payloads
 * and cache state do not.
 */
def allowedTrackedBinaryPaths = [
        'gradle/wrapper/gradle-wrapper.jar',
        'third-party-sources/mysql-connector-j/26.7.0/mysql-connector-j-26.7.0.tar.gz'
] as Set

def isForbiddenQualificationPath = { String rawPath ->
    String path = rawPath.replace('\\', '/').toLowerCase(Locale.ROOT)
    List<String> segments = path.split('/') as List
    String name = segments.isEmpty() ? path : segments.last()
    if (allowedTrackedBinaryPaths.contains(path)) return false

    Set<String> forbiddenSegments = [
            'templates', 'observations', 'leases', 'runs', 'world', 'logs',
            'playerdata', 'saves', '.eventtrail-template', '.eventtrail-run'
    ] as Set
    Set<String> forbiddenNames = [
            '.eventtrail-template-cache.json', '.eventtrail-cache-owner.json',
            'cache-marker.json', 'copying', 'ready', 'ready_to_run',
            'incomplete', 'latest.log'
    ] as Set
    List<String> forbiddenSuffixes = [
            '.mrpack', '.zip', '.tar', '.tar.gz', '.tgz', '.7z', '.rar', '.jar',
            '.db', '.sqlite', '.db-shm', '.db-wal', '.log', '.pem', '.key',
            '.p12', '.pfx', '.jks', '.crt', '.cer'
    ]

    return segments.any { forbiddenSegments.contains(it) }
            || forbiddenNames.contains(name)
            || forbiddenSuffixes.any { name.endsWith(it) }
            || name.contains('provider-response')
            || name.contains('freshness-receipt')
}
ext.eventTrailIsForbiddenQualificationPath = isForbiddenQualificationPath

def verifyQualificationRepositoryBoundary = tasks.register(
        'verifyEventTrailQualificationRepositoryBoundary') {
    group = 'verification'
    description = 'Rejects tracked external-cache, provider, pack, or runtime payloads.'
    doLast {
        List<String> paths = []
        File gitDirectory = layout.projectDirectory.dir('.git').asFile
        if (gitDirectory.exists()) {
            File internalTestingGit = layout.projectDirectory.dir('internal-testing/.git').asFile
            if (internalTestingGit.isDirectory()
                    && project.findProperty('eventTrailInternalOverlayApplied') != true) {
                // Split R without the internal overlay: this listing alone would read EventTrail through the new
                // .gitignore. Run only inside the outer public-boundary simulation, by its one-use token: the value
                // from the environment, the file's writer an ancestor of this process.
                File tokenFile = layout.projectDirectory.file('build/public-boundary-token/token').asFile
                String given = System.getenv('EVENTTRAIL_BOUNDARY_TOKEN')
                // T (A1 9 (b) G2): the same value as the overlay's eventTrailBoundaryTokenLifetime (a code test).
                java.time.Duration boundaryTokenLifetime = java.time.Duration.ofMinutes(60)
                // The token file (A1 9 (b) G6): exactly value=, pid=, start=, written=, in that order, ASCII, LF,
                // a final LF, nothing else. Any other form refuses.
                Map<String, String> token = null
                if (Files.isRegularFile(tokenFile.toPath(), LinkOption.NOFOLLOW_LINKS)) {
                    String text = new String(Files.readAllBytes(tokenFile.toPath()), StandardCharsets.ISO_8859_1)
                    java.util.regex.Matcher form = text =~
                            /\Avalue=([0-9a-f]{32})\npid=([0-9]+)\nstart=([\x21-\x7e]+)\nwritten=([\x21-\x7e]+)\n\z/
                    if (form.matches()) {
                        token = [value: form.group(1), pid: form.group(2), start: form.group(3),
                                 written: form.group(4)]
                    }
                }
                // Its age: written parses as an Instant, is not after now, and now - written < T.
                boolean fresh = false
                if (token != null) {
                    try {
                        java.time.Instant written = java.time.Instant.parse(token['written'])
                        java.time.Instant now = java.time.Instant.now()
                        fresh = !written.isAfter(now)
                                && java.time.Duration.between(written, now).compareTo(boundaryTokenLifetime) < 0
                    } catch (java.time.format.DateTimeParseException ignored) {
                        fresh = false
                    }
                }
                boolean admitted = fresh && given != null && given ==~ /[0-9a-f]{32}/
                        && MessageDigest.isEqual(given.getBytes(StandardCharsets.UTF_8),
                        token['value'].getBytes(StandardCharsets.UTF_8))
                if (admitted) {
                    admitted = false
                    def ancestor = ProcessHandle.current().parent()
                    while (ancestor.isPresent()) {
                        def started = ancestor.get().info().startInstant()
                        if (!started.isPresent()) break
                        if (Long.toString(ancestor.get().pid()) == token['pid']
                                && started.get().toString() == token['start']) {
                            admitted = true
                            break
                        }
                        ancestor = ancestor.get().parent()
                    }
                }
                if (!admitted) {
                    throw new GradleException('PUBLIC_BOUNDARY_SPLIT_R: the public boundary check of a split '
                            + 'repository runs only inside the outer public-boundary simulation')
                }
                Files.delete(tokenFile.toPath())
            }
            String executable = System.getProperty('os.name')
                    .toLowerCase(Locale.ROOT).contains('windows') ? 'git.exe' : 'git'
            temporaryDir.mkdirs()
            Process process = new ProcessBuilder(
                    executable,
                    '-c',
                    "safe.directory=${project.projectDir.absolutePath.replace('\\', '/')}",
                    'ls-files', '--cached', '--others', '--exclude-standard',
                    '-z')
                    .directory(project.projectDir)
                    .redirectErrorStream(true)
                    .redirectOutput(new File(temporaryDir, 'git-ls-files.bin'))
                    .start()
            if (!process.waitFor(30, TimeUnit.SECONDS)) {
                process.destroyForcibly()
                throw new GradleException(
                        'Timed out while enumerating tracked qualification-boundary paths')
            }
            File listing = new File(temporaryDir, 'git-ls-files.bin')
            byte[] stdout = listing.bytes
            if (process.exitValue() != 0) {
                throw new GradleException(
                        'Could not enumerate tracked qualification-boundary paths: '
                                + new String(stdout, StandardCharsets.UTF_8).trim())
            }
            paths.addAll(new String(stdout, StandardCharsets.UTF_8)
                    .split('\\u0000')
                    .findAll { !it.isEmpty() })
        } else {
            // GitHub/source archives have no .git directory. Validate their
            // shipped source tree while excluding generated build roots.
            fileTree(project.projectDir) {
                exclude '.gradle/**', 'build/**', 'out/**', 'run/**', 'common/build/**'
            }.visit { details ->
                if (!details.directory) paths.add(details.relativePath.pathString)
            }
        }

        List<String> forbidden = paths.findAll(isForbiddenQualificationPath)
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    'Repository contains external-cache, provider, pack, credential, '
                            + "or generated runtime material: ${forbidden.sort()}")
        }
    }
}

